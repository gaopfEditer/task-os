[package]
name = "task-os-desktop"
version = "0.1.0"
description = "Task OS desktop shell for the GitHub-backed board"
authors = ["Task OS contributors"]
edition = "2021"

[lib]
name = "task_os_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
keyring = { version = "3", features = ["linux-native", "apple-native", "windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
